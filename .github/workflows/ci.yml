name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # What the synthetic-archive and flag tests reach.
  #
  # The paths that drive a REAL decoder -- opening an actual archive, following
  # an actual volume set -- are not exercised here: what they are FOR is a
  # multi-volume set, and a binary fixture of one is a thing this repository
  # does not carry. A live proof belongs with a real set, not with a fixture
  # nobody can read.
  COVERAGE_MIN: "65.0"

jobs:
  native:
    name: native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "not gofmt'd:"; echo "$out"; exit 1; }

      - name: Vet
        run: go vet ./...

      # ⛔ THREE FOREIGN JUDGES HERE HAVE NEVER RUN. Each skips itself when its
      # tool is absent, and this CI installed none of them:
      #
      #   7zz      TestSevenZipsOwnVolumesStillWork — 7-Zip's own multi-volume
      #            split, the trap the rar driver exists to avoid
      #   xorriso  TestAnISOOpensLikeAnyOtherArchive — an ISO this project did
      #            not produce, which is the point of it
      #   cpio     the newc/odc and the old-binary round trips, read back by
      #            the system's own cpio
      #
      # A green lane over a skipped judge looks exactly like a green lane over
      # a passing one. Found by go-fleettools/judgescan.
      #
      # libarchive-tools rather than cpio: GNU cpio has no `pwb` format and
      # half the binary-variant fixture cannot be built with it.
      - name: install the foreign judges
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools xorriso 7zip

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=cover.out -timeout 5m ./...

      # A skip is not a pass and the summary line cannot tell them apart.
      - name: the judges must have judged
        run: |
          set -euo pipefail
          out=$(go test -count=1 -v -run 'TestSevenZipsOwnVolumesStillWork|TestAnISOOpensLikeAnyOtherArchive|TestTheOldBinaryCpioReadsThroughTheSystemsOwnCpio|TestACpioReadsThroughTheSystemsOwnCpio' . 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          case "$out" in
            *"--- SKIP"*) echo "::error::a foreign judge skipped; its tool is not installed"; exit 1 ;;
          esac
          for t in TestSevenZipsOwnVolumesStillWork TestAnISOOpensLikeAnyOtherArchive \
                   TestTheOldBinaryCpioReadsThroughTheSystemsOwnCpio TestACpioReadsThroughTheSystemsOwnCpio; do
            case "$out" in
              *"--- PASS: $t"*) ;;
              *) echo "::error::$t neither passed nor skipped — did it run at all?"; exit 1 ;;
            esac
          done

      - name: Enforce coverage floor
        run: |
          set -euo pipefail
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${COVERAGE_MIN}%)"
          awk -v c="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "coverage ${total}% below floor ${COVERAGE_MIN}%"; exit 1; }

  # Every 64-bit target the fleet ships for, CGO-free. A driver that reads a
  # byte order wrong shows up here and nowhere else: s390x is big-endian.
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - name: Vet
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...
